services:
  youtubarr:
    build:
      context: .
      dockerfile: Dockerfile
    image: youtubarr:1.0.0
    container_name: youtubarr
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${YOUTUBARR_PORT:-8788}:8788"
    environment:
      TZ: "${TZ:-Europe/London}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      YOUTUBARR_LOG_LEVEL: "${YOUTUBARR_LOG_LEVEL:-INFO}"
      YOUTUBARR_MAX_VIDEO_HEIGHT: "${YOUTUBARR_MAX_VIDEO_HEIGHT:-1080}"
      YOUTUBARR_CACHE_MAX_GB: "${YOUTUBARR_CACHE_MAX_GB:-20}"
      YOUTUBARR_CACHE_TTL_HOURS: "${YOUTUBARR_CACHE_TTL_HOURS:-24}"
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ${YOUTUBARR_CONFIG_DIR:-./config}:/config
      - ${YOUTUBARR_LIBRARY_DIR:-./library}:/library
      - ${YOUTUBARR_CACHE_DIR:-./cache}:/cache
      - type: bind
        source: ${YOUTUBARR_MOUNT_DIR:-/mnt/youtubarr}
        target: /mnt/youtubarr
        bind:
          propagation: rshared
