services:

  youtubarr:
    container_name: youtubarr
    image: ghcr.io/fudmonk95/youtubarr:latest
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      TZ: Europe/London
      PUID: "1001"
      PGID: "1001"

      # User/group used by Sonarr/Lidarr/Radarr inside DUMB.
      # Youtubarr keeps ownership as PUID but makes every /library directory
      # group-writable and setgid to ARR_GID so all future folders inherit it.
      ARR_UID: "1000"
      ARR_GID: "1000"

      YOUTUBARR_LOG_LEVEL: INFO
      YOUTUBARR_MAX_VIDEO_HEIGHT: "1080"
      YOUTUBARR_CACHE_MAX_GB: "20"
      YOUTUBARR_CACHE_TTL_HOURS: "24"

    volumes:
      - /mnt/appdata/Youtubarr/config:/config
      - /mnt/appdata/Youtubarr/library:/library
      - /mnt/appdata/Youtubarr/cache:/cache

      # Youtubarr creates its FUSE filesystem inside this single container.
      # rshared propagates the nested FUSE mount back to the Debian/LXC host.
      - type: bind
        source: /mnt/youtubarr
        target: /mnt/youtubarr
        bind:
          propagation: rshared

    ports:
      - "8788:8788"

    devices:
      - /dev/fuse:/dev/fuse:rwm

    cap_add:
      - SYS_ADMIN

    security_opt:
      - apparmor:unconfined

    networks:
      - dumb-live-network


networks:

  dumb-live-network:
    external: true
    name: dumb-live_default
